name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app directory
        run: npx electron-builder --mac dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # electron-builder 跳过签名会留下残缺的 linker 签名，下载后 Gatekeeper 直接报「已损坏」；
      # 补一次完整的 ad-hoc 深度签名
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/mac-arm64/DeepSeek Harness.app"

      - name: Build dmg from signed app
        run: npx electron-builder --mac dmg zip --prepackaged "dist/mac-arm64/DeepSeek Harness.app" --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
