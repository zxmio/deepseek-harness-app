name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$HOME/.appstoreconnect"
          printf '%s' "$APPLE_API_KEY_P8" > "$HOME/.appstoreconnect/AuthKey.p8"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      # 不走 electron-builder 的 CSC_LINK（其临时钥匙串逻辑有 bug，
      # set-key-partition-list 会拿证书密码去解锁钥匙串导致必然失败）。
      # 手动建钥匙串导入证书，让 electron-builder 自动发现签名身份。
      - name: Import Developer ID certificate
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$CSC_LINK_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci-keychain "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci-keychain "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build, sign and notarize
        run: npx electron-builder --mac --publish never
        env:
          APPLE_API_KEY: /Users/runner/.appstoreconnect/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
